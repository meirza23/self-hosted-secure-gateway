# /etc/nginx/sites-available/metopal.site
#
# sites-available dosyayı tutar, sites-enabled aktif olanları.
# Etkinleştirmek sembolik bağlantı koymaktır:
#   sudo ln -s /etc/nginx/sites-available/metopal.site /etc/nginx/sites-enabled/
#   sudo rm /etc/nginx/sites-enabled/default
#
# 443 bloğundaki "managed by Certbot" satırları certbot tarafından
# eklenmiştir; 80 bloğu da HTTPS'e yönlendirme için o oluşturdu.

server {
    server_name metopal.site www.metopal.site;

    root /var/www/metopal.site;
    index index.html;

    server_tokens off;

    # --- güvenlik başlıkları ---
    # always: hata sayfalarında da gönderilsin

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # data: — favicon sayfaya gömülü SVG olarak duruyor
    # unsafe-inline — stil ve script dosya içinde
    add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; script-src 'self' 'unsafe-inline'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    # yalnızca HTTPS bloğunda anlamlı
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # --- istek sınırları ---
    client_max_body_size  1m;
    client_body_timeout   10s;
    client_header_timeout 10s;

    # limits.conf içinde tanımlı bölge
    limit_req zone=genel burst=20 nodelay;

    location / {
        try_files $uri $uri/ =404;
    }

    # gizli dosyalar: .git, .env ve benzerleri — botların en çok aradığı yollar
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # editör yedekleri
    location ~ ~$ {
        deny all;
    }

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/metopal.site/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/metopal.site/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = www.metopal.site) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    if ($host = metopal.site) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    listen [::]:80;

    server_name metopal.site www.metopal.site;

    # alan adı dışından, doğrudan IP'ye gelen istekler burada kalır
    return 404; # managed by Certbot
}
