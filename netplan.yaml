# /etc/netplan/50-cloud-init.yaml
# Sabit yerel adres. Modemdeki port yönlendirme kuralının hedefi
# değişmemeli, bu yüzden DHCP kullanılmıyor. Adres, modem üzerinde
# daraltılan DHCP havuzunun (2-200) dışından seçildi.
#
# Not: Bu dosya cloud-init tarafından yönetiliyordu. Önce onun ağ
# yapılandırmasına müdahalesi kapatıldı:
#   echo 'network: {config: disabled}' | \
#     sudo tee /etc/cloud/cloud.cfg.d/99-disable-network-config.cfg

network:
  version: 2
  ethernets:
    ens33:
      dhcp4: false
      addresses:
        - 192.168.1.210/24
      routes:
        - to: default
          via: 192.168.1.1
      nameservers:
        addresses: [8.8.8.8, 1.1.1.1]
