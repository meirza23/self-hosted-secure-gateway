# /etc/fail2ban/filter.d/nginx-noscript.conf
#
# access.log üzerinde bilinen zafiyet yollarını 404/403 dönüşüyle
# birlikte arar. Uygulamadan önce test edilmeli:
#   sudo fail2ban-regex /var/log/nginx/access.log \
#     /etc/fail2ban/filter.d/nginx-noscript.conf

[Definition]
failregex = ^<HOST> .* "(GET|POST|HEAD) /.*(wp-|wordpress|xmlrpc|phpmyadmin|\.env|\.git|\.aws|/SDK/|admin|setup\.php|shell|eval-stdin).*" (404|403) 
ignoreregex =
datepattern = ^[^\[]*\[({DATE})
              {^LN-BEG}
