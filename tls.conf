# /etc/nginx/conf.d/tls.conf
#
# Protokoller, şifre takımları ve oturum ayarları certbot'un
# options-ssl-nginx.conf dosyasından geliyor (Mozilla intermediate
# profili: TLS 1.2/1.3, yalnızca ileri gizlilik sağlayan şifre
# takımları, oturum biletleri kapalı). O dosya elle düzenlenmemeli —
# düzenlenirse certbot gelecekteki güvenlik güncellemelerini
# otomatik uygulayamıyor.
#
# OCSP stapling kullanılmıyor: Let's Encrypt OCSP hizmetini 2025'te
# sonlandırdı ve sertifikalarda artık OCSP adresi yer almıyor.
# İptal bilgisi CRL üzerinden sağlanıyor.
